<!DOCTYPE html>
<html>
<head>
  <title>bud icon design</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #111419;
      font-family: monospace;
    }

    .icon-container {
      width: 512px;
      height: 512px;
      background-color: #88aa99;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 0;
    }

    .circles {
      width: 80%;
      height: 80%;
      position: relative;
    }

    .icon-circle {
      width: 100%;
      height: 100%;
      background-color: #bbddbb;
      border-radius: 50%;
    }

    .pot-circle {
      width: 60%;
      height: 60%;
      background-color: #8B5E3C;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .dirt-circle {
      width: 55%;
      height: 55%;
      background-color: #5C4033;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .info {
      position: fixed;
      top: 20px;
      left: 20px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="info">
    <p>container: #88aa99</p>
    <p>circle: #bbddbb</p>
    <p>pot: #8B5E3C</p>
    <p>dirt: #5C4033</p>
    <p>size: 512x512</p>
  </div>
  <div class="icon-container">
    <div class="circles">
      <div class="pot-circle"></div>
      <div class="dirt-circle"></div>
      <div class="icon-circle"></div>
    </div>
  </div>
</body>
</html>
