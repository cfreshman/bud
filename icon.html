<!DOCTYPE html>
<html>
<head>
  <title>bud icon design</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #111419;
      font-family: monospace;
    }

    .icon-container {
      width: 512px;
      height: 512px;
      background-color: #88aa99;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 0;
    }

    .icon-circle {
      width: 80%;
      height: 80%;
      background-color: #bbddbb;
      border-radius: 50%;
    }

    .info {
      position: fixed;
      top: 20px;
      left: 20px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="info">
    <p>container: #88aa99</p>
    <p>circle: #bbddbb</p>
    <p>size: 512x512</p>
  </div>
  <div class="icon-container">
    <div class="icon-circle"></div>
  </div>
</body>
</html>
